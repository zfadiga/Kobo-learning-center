kind = "web"
previewPath = "/"
title = "Kobo Learning Center"
version = "1.0.0"
id = "artifacts/kobo-learning"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25694

[services.development]
run = "pnpm --filter @workspace/kobo-learning run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kobo-learning", "run", "build" ]
publicDir = "artifacts/kobo-learning/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25694"
BASE_PATH = "/"
